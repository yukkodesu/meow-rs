[package]
name = "flclash-meow-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_yaml.workspace = true
serde_ignored = "0.1"
meow-common.workspace = true
meow-config = { workspace = true, features = ["ss", "trojan", "vless", "vless-vision", "vless-encryption", "vmess", "snell", "anytls", "hysteria2", "ech-tls-tunnel", "mux", "kcptun"] }
meow-proxy = { workspace = true, features = ["ss", "trojan", "vless", "vless-vision", "vless-encryption", "vmess", "snell", "anytls", "hysteria2", "ech-tls-tunnel", "mux", "kcptun"] }
meow-dns = { workspace = true, features = ["dns-server", "encrypted"] }
meow-listener = { workspace = true, features = ["listener-mixed", "listener-http", "listener-socks5", "listener-tun"] }
meow-tunnel.workspace = true
meow-api = { workspace = true, features = ["listener-tun"] }
meow-app = { path = "../meow-app", default-features = false }
time.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
toml = "0.8"

[lints]
workspace = true
